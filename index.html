<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keuangan Pribadi</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>💰 Keuangan Pribadi</h1>
      <p>Tracker harian — gratis, database di Google Sheets.</p>
    </header>

    <div id="banner" class="banner" style="display:none"></div>

    <div class="cards">
      <div class="card balance"><div class="label">Saldo</div><div class="value" id="bal">Rp 0</div></div>
      <div class="card income"><div class="label">Pemasukan</div><div class="value" id="inc">Rp 0</div></div>
      <div class="card expense"><div class="label">Pengeluaran</div><div class="value" id="exp">Rp 0</div></div>
    </div>

    <div class="panel">
      <h2>Tambah Transaksi</h2>
      <form id="txForm" class="form-grid">
        <div class="field">
          <label for="f_date">Tanggal</label>
          <input type="date" id="f_date" required />
        </div>
        <div class="field">
          <label for="f_type">Tipe</label>
          <select id="f_type">
            <option value="expense">Pengeluaran</option>
            <option value="income">Pemasukan</option>
          </select>
        </div>
        <div class="field">
          <label for="f_category">Kategori</label>
          <input id="f_category" list="catList" placeholder="Makan, Transport, Gaji..." />
          <datalist id="catList">
            <option value="Makan"></option><option value="Transport"></option>
            <option value="Belanja"></option><option value="Tagihan"></option>
            <option value="Hiburan"></option><option value="Kesehatan"></option>
            <option value="Gaji"></option><option value="Freelance"></option>
            <option value="Investasi"></option><option value="Lainnya"></option>
          </datalist>
        </div>
        <div class="field">
          <label for="f_amount">Jumlah (Rp)</label>
          <input type="number" id="f_amount" min="0" step="1000" placeholder="50000" required />
        </div>
        <div class="field">
          <label for="f_note">Catatan</label>
          <input id="f_note" placeholder="optional" />
        </div>
        <div class="field">
          <button type="submit">Simpan</button>
        </div>
      </form>
    </div>

    <div class="panel">
      <h2>Daftar Transaksi</h2>
      <div class="toolbar">
        <div class="field">
          <label for="f_month">Bulan</label>
          <select id="f_month"><option value="">Semua bulan</option></select>
        </div>
        <div class="field">
          <label for="f_type">Tipe</label>
          <select id="f_type_filter">
            <option value="">Semua</option>
            <option value="income">Pemasukan</option>
            <option value="expense">Pengeluaran</option>
          </select>
        </div>
        <div class="field">
          <label for="f_search">Cari</label>
          <input id="f_search" placeholder="note / kategori" />
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <button class="ghost" id="exportBtn">⬇️ Export CSV</button>
        </div>
      </div>
      <table>
        <thead>
          <tr><th>Tanggal</th><th>Tipe</th><th>Kategori</th><th class="amt">Jumlah</th><th>Catatan</th><th></th></tr>
        </thead>
        <tbody id="txBody"></tbody>
      </table>
    </div>

    <div class="charts">
      <div class="chart-box">
        <h3>Pemasukan vs Pengeluaran per Bulan</h3>
        <canvas id="barChart"></canvas>
      </div>
      <div class="chart-box">
        <h3>Pengeluaran per Kategori</h3>
        <canvas id="catChart"></canvas>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="config.js"></script>
  <script src="finance-core.js"></script>
  <script src="app.js"></script>
</body>
</html>
