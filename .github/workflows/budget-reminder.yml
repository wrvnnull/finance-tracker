name: Budget Reminder (Telegram)

on:
  schedule:
    # Tiap hari 08:00 WIB (UTC+7) = 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run budget report
        env:
          APPS_SCRIPT_URL: ${{ secrets.CF_WORKER_URL }}
          APPS_SCRIPT_TOKEN: ${{ secrets.APPS_SCRIPT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/budget_report.py
